<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thalandor Online</title>
    <style>
      :root {
        --bg: #0d0f0c;
        --panel: rgba(20, 18, 14, 0.92);
        --line: #5b4a2f;
        --gold: #d8b25a;
        --text: #f1e9d2;
        --muted: #a39a85;
        --error: #ff8a7a;
        --font: Georgia, 'Times New Roman', serif;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text); font-family: var(--font); }
      #game { position: absolute; inset: 0; }
      #ui { position: absolute; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      [hidden] { display: none !important; }

      .screens { position: absolute; inset: 0; overflow-y: auto; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: radial-gradient(circle at 50% 35%, #1f2418 0%, var(--bg) 70%); }
      .panel { width: min(340px, 100%); padding: 24px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 0 4px #00000066, 0 20px 60px #000c; display: flex; flex-direction: column; gap: 12px; }
      .panel.wide { width: min(760px, 100%); }
      .title { margin: 0; text-align: center; font-size: 30px; letter-spacing: 1px; color: var(--gold); text-shadow: 0 2px 0 #000; font-weight: normal; }
      .subtitle { margin: 0 0 4px; text-align: center; font-size: 16px; color: var(--muted); font-weight: normal; letter-spacing: 2px; text-transform: uppercase; }
      .warning { margin: 0; padding: 8px 10px; border: 1px solid #8a5a2a; background: #2a1a0c; color: #f0c48a; font-size: 14px; text-align: center; }
      .muted { color: var(--muted); font-size: 13px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .row.center { justify-content: center; align-items: center; }
      .row > .btn { flex: 1; }
      .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .char-card { font: inherit; color: var(--text); background: #14120e; border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
      .char-card:hover { border-color: #8a7444; }
      .char-card.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); background: #1f1a10; }
      .char-name { font-size: 16px; overflow-wrap: anywhere; }
      .preview { image-rendering: pixelated; }
      .preview.big { background: #14120e; border: 1px solid var(--line); }
      .actions { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
      .create { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
      .side { display: flex; flex-direction: column; gap: 8px; align-items: center; }
      .form { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 12px; }
      .choices { display: flex; flex-wrap: wrap; gap: 6px; }
      .choices.classes { display: grid; grid-template-columns: 1fr 1fr; }
      .choice { font: inherit; font-size: 14px; color: var(--text); background: #14120e; border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
      .choice:hover { border-color: #8a7444; }
      .choice.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); background: #2a2110; }
      .choice.swatch { width: 28px; height: 28px; padding: 0; border-radius: 50%; }
      .choice.swatch.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--gold); }
      .btn.danger:hover:not(:disabled) { border-color: var(--error); }
      .error.small { text-align: left; font-size: 13px; }
      .label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
      .field { font: inherit; font-size: 16px; padding: 8px 10px; color: var(--text); background: #0b0a08; border: 1px solid var(--line); outline: none; }
      .field:focus { border-color: var(--gold); }
      .field.code { text-transform: uppercase; letter-spacing: 3px; }
      .btn { font: inherit; font-size: 16px; padding: 9px 12px; color: var(--text); background: #2a241a; border: 1px solid var(--line); cursor: pointer; }
      .btn:hover:not(:disabled) { border-color: var(--gold); }
      .btn:disabled { opacity: 0.6; cursor: default; }
      .btn.primary { background: #5a4520; border-color: var(--gold); }
      .btn.small { font-size: 14px; padding: 6px 10px; }
      .or { text-align: center; color: var(--muted); font-size: 13px; }
      .error { min-height: 1.2em; margin: 0; color: var(--error); font-size: 14px; text-align: center; }
      .version { position: absolute; right: 12px; bottom: 8px; font-size: 12px; color: var(--muted); }

      .hud { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }

      .combat-hud { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none !important; }
      .bars { display: flex; flex-direction: column; gap: 3px; width: 340px; max-width: calc(100vw - 24px); }
      .bar { position: relative; height: 14px; background: #0b0a08cc; border: 1px solid var(--line); overflow: hidden; }
      .bar-fill { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width 120ms linear; }
      .bar-fill.hp { background: linear-gradient(#5fbf5a, #2f8a35); }
      .bar-text { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; }
      .hotbar { display: flex; gap: 5px; }
      .slot { position: relative; width: 44px; height: 44px; border: 2px solid #6a5a3a; background: #14120e; box-shadow: inset 0 0 0 1px #000, 0 2px 6px #000a; overflow: hidden; }
      .slot.empty { opacity: 0.45; }
      .slot-icon { width: 100%; height: 100%; display: block; image-rendering: auto; }
      .slot-sweep { position: absolute; inset: 0; background: conic-gradient(#000000b0 calc(var(--cd, 0) * 360deg), transparent 0); }
      .slot-cd { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px #000; }
      .slot-key { position: absolute; left: 2px; top: 0; font-size: 10px; color: #f1e9d2; text-shadow: 0 1px 2px #000; }
      .slot-cost { position: absolute; right: 2px; bottom: 0; font-size: 10px; color: #9cc8ff; text-shadow: 0 1px 2px #000; }
      .slot.nores .slot-icon { filter: grayscale(0.8) brightness(0.55); }
      .slot.pressed { animation: slot-press 160ms ease-out; }
      @keyframes slot-press { 0% { border-color: var(--gold); transform: scale(0.94); } 100% { border-color: #6a5a3a; transform: scale(1); } }
      .xp-row { display: flex; align-items: center; gap: 6px; width: 340px; max-width: calc(100vw - 24px); }
      .level-badge { min-width: 22px; height: 18px; padding: 0 4px; display: grid; place-items: center; font-size: 12px; color: #1a1408; background: var(--gold); border: 1px solid #000; }
      .xp-bar { position: relative; flex: 1; height: 8px; background: #0b0a08cc; border: 1px solid var(--line); overflow: hidden; }
      .xp-bar .bar-text { font-size: 9px; }
      .xp-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(#b48cf0, #6d45b8); transition: width 200ms linear; }
      .combo { display: flex; gap: 4px; }
      .combo-pip { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #000; background: #3a2a14; }
      .combo-pip.on { background: #f0c040; box-shadow: 0 0 6px #f0c040; }
      .channel-bar { width: 180px; height: 8px; background: #0b0a08cc; border: 1px solid var(--line); overflow: hidden; }
      .channel-fill { height: 100%; width: 0; background: var(--gold); }
      .game-window { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(820px, calc(100vw - 24px)); max-height: calc(100vh - 140px); overflow-y: auto; box-sizing: border-box; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 0 4px #00000066, 0 20px 60px #000c; display: flex; flex-direction: column; gap: 10px; }
      .win-head { display: flex; justify-content: space-between; align-items: center; }
      .win-title { margin: 0; font-size: 22px; font-weight: normal; color: var(--gold); }
      .win-foot { text-align: right; }
      .win-cols { display: flex; flex-wrap: wrap; gap: 14px; }
      .win-section { flex: 1 1 220px; display: flex; flex-direction: column; gap: 5px; }
      .win-section h3 { margin: 6px 0 2px; font-size: 15px; font-weight: normal; color: var(--gold); }
      .attr-row, .stat-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
      .attr-name { flex: 1; }
      .stat-row > span:first-child::first-letter { text-transform: uppercase; }
      .attr-value, .stat-value { color: var(--gold); min-width: 3ch; text-align: right; }
      .btn.tiny { font-size: 13px; padding: 1px 8px; }
      .ability-pool { display: flex; flex-wrap: wrap; gap: 5px; }
      .slot.pick, .slot.target { cursor: pointer; }
      .slot.pick.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
      .passive-row { font-size: 14px; }
      .passive-row.locked { color: var(--muted); opacity: 0.6; }
      .spec-card { border: 1px solid var(--line); padding: 10px; background: #14120e; }
      .spec-card.on { border-color: var(--gold); }
      .pause-menu { width: min(320px, calc(100vw - 24px)); }
      .pause-actions { display: flex; flex-direction: column; gap: 8px; }
      .talent-circle { width: 100%; max-width: 640px; max-height: calc(100vh - 300px); align-self: center; }
      .talent-link { stroke: #4a3d28; stroke-width: 2; }
      .talent-link.lit { stroke: var(--gold); stroke-width: 3; }
      .talent-node circle { fill: #14120e; stroke: #4a3d28; stroke-width: 2; }
      .talent-node.notable circle { stroke-width: 3; }
      .talent-node.keystone circle { stroke-width: 4; }
      .talent-node.start circle { fill: #2f5a4a; stroke: #7fc0a0; }
      .talent-node.can { cursor: pointer; }
      .talent-node.can circle { stroke: #b49a5a; }
      .talent-node.can:hover circle { stroke: var(--gold); fill: #2a2110; }
      .talent-node.owned circle { fill: #8a6a28; stroke: var(--gold); }
      .talent-dir { fill: var(--gold); font: 15px var(--font); }
      .hotbar-row { display: flex; gap: 12px; align-items: flex-end; }
      .slot.potion .slot-icon { padding: 6px; box-sizing: border-box; }
      .side-window { left: auto; right: 12px; top: 60px; transform: none; width: min(330px, calc(100vw - 24px)); }
      .shop-window { right: auto; left: 12px; }
      .bag-grid { display: grid; grid-template-columns: repeat(6, 44px); gap: 4px; justify-content: center; }
      .item-slot { position: relative; width: 44px; height: 44px; box-sizing: border-box; border: 2px solid #3a3226; background: #0e0c09; cursor: default; }
      .item-slot .slot-icon { padding: 5px; box-sizing: border-box; }
      .item-slot.broken { box-shadow: inset 0 0 0 2px #c03030; }
      .item-slot.broken .slot-icon { filter: sepia(1) hue-rotate(-40deg) saturate(3); }
      .item-count { position: absolute; right: 2px; bottom: 0; font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; }
      .bag-gold { color: var(--gold); text-align: right; font-size: 15px; }
      .item-tip { position: fixed; z-index: 50; max-width: 300px; padding: 8px 10px; background: rgba(12, 10, 8, 0.96); border: 1px solid var(--line); pointer-events: none !important; font-size: 13px; line-height: 1.35; }
      .tip-title { font-size: 15px; margin-bottom: 2px; }
      .shop-list { display: flex; flex-direction: column; gap: 6px; }
      .shop-row { display: flex; align-items: center; gap: 8px; }
      .shop-name { flex: 1; font-size: 14px; }
      .gear-section { flex: 0 0 auto; }
      .equip-doll { display: flex; gap: 10px; align-items: center; }
      .equip-col { display: flex; flex-direction: column; gap: 4px; }
      .equip-sprite { width: 192px; height: 192px; display: grid; place-items: center; background: radial-gradient(circle at 50% 60%, #2a2418 0%, #0e0c09 75%); border: 1px solid var(--line); }
      .live-sprite { width: 192px; height: 192px; image-rendering: pixelated; }
      .passive-row { display: flex; flex-direction: column; margin-bottom: 4px; }
      .passive-name { font-size: 14px; }
      .passive-desc { font-size: 12px; color: var(--muted); }
      .equip-grid { display: grid; grid-template-columns: repeat(4, auto); gap: 6px 10px; justify-content: start; }
      .equip-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
      .hud-banner, .hud-prompt { padding: 6px 12px; background: #0b0a08d0; border: 1px solid var(--line); font-size: 15px; }
      .hud-banner { color: #ff9a8a; }
      .hud-prompt { color: var(--gold); }
      .chat { position: absolute; left: 12px; bottom: 12px; width: min(360px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 4px; }
      .chat-log { max-height: 180px; overflow-y: auto; font-size: 14px; text-shadow: 0 1px 2px #000; }
      .chat-line { padding: 1px 0; overflow-wrap: anywhere; }
      .chat-line.system { color: var(--gold); font-style: italic; }
      .chat-from { color: var(--gold); }
      .chat-input { font: inherit; font-size: 14px; padding: 6px 8px; color: var(--text); background: var(--panel); border: 1px solid var(--line); outline: none; opacity: 0; pointer-events: none; }
      .chat.open .chat-input { opacity: 1; pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
